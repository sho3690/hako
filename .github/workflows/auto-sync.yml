name: 同期

# 15分ごと: 中継に届いた追加・変更（画面・Claude・リンクから）を取り込み、暗号化して data/state.json に保存する。
#
# 15分ごとに動かすしくみ（土日 DONICHI と同じ）:
# - 新しいリポジトリでは GitHub の定時実行（schedule）が一度も起動しないことがある（2026年に多数の報告）。
#   そこで各回の next ジョブが、環境 interval の待ち時間（15分。待つ間はマシンを使わない）のあとで次の回を予約する。
# - 自分より新しい回が動いていれば予約しない（予約が二重になっても一本にまとまる）。
# - schedule は予約が途切れたときの予備（1時間ごと）。止めるときは gh workflow disable、再開は enable のあと手動で1回動かす。
#
# 守り: checkout に資格情報を残さず、push のときだけトークンを使う。外部の Action はコミットで固定。ログには件数しか出さない。
on:
  schedule:
    - cron: "41 * * * *"   # 予備。混み合う毎時0分を避ける
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 同期する
        env:
          HAKO_KEY: ${{ secrets.HAKO_KEY }}
        run: node scripts/sync.mjs
      - name: 保存する
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: bash scripts/push-state.sh "同期"

  next:
    # 15分待ってから次の回を予約する（待つ間はマシンを使わない）。同期の成否に関係なく続ける
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: interval
      deployment: false
    permissions:
      actions: write
    steps:
      - name: 次の回を予約する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/auto-sync.yml" --jq .state)
          if [ "$state" != "active" ]; then echo "止めてあるので予約しません"; exit 0; fi
          newer=$(gh run list -R "$GITHUB_REPOSITORY" --workflow auto-sync.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId > $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$newer" != "0" ]; then echo "新しい回が動いているので、予約はそちらに任せます"; exit 0; fi
          for i in 1 2 3 4 5; do
            gh workflow run auto-sync.yml -R "$GITHUB_REPOSITORY" --ref main && { echo "次の回を予約しました"; exit 0; }
            sleep 20
          done
          exit 1
