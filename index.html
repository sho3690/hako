<div id="lock" class="lock" hidden></div>

<div id="shell" class="shell" hidden>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./" aria-label="箱 HAKO">
        <span class="brand-ja">箱</span><span class="brand-en">HAKO</span>
      </a>
      <button type="button" class="icon-btn" data-action="settings" aria-label="設定"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <div class="composer-bar" id="composer-bar">
    <form class="composer" id="composer" novalidate>
      <label class="visually-hidden" for="put">箱に入れるもの</label>
      <textarea id="put" class="put" rows="1" maxlength="4000" enterkeyhint="send" placeholder="思いついたことを入れる" aria-describedby="put-help"></textarea>
      <button type="submit" class="btn btn-primary put-btn"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>入れる</button>
    </form>
    <p class="visually-hidden" id="put-help">Enter で入れます。改行で区切ると、まとめて入れられます。</p>
  </div>

  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<div class="toast-viewport" aria-live="polite"><div id="toast" class="toast" role="status" hidden></div></div>
</body>
</html>
